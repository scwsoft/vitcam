## 8. Testing Script (Optional)

**File: `test_coturn.sh`** (CREATE NEW FILE)

```bash
#!/bin/bash
echo "Testing COTURN functionality..."

# Check if COTURN container is running
if docker-compose ps coturn | grep -q "Up"; then
    echo "✅ COTURN container is running"
    
    # Test STUN server
    if timeout 10 docker exec webrtc-coturn turnutils_stunclient -p 3478 localhost >/dev/null 2>&1; then
        echo "✅ STUN server is responding"
    else
        echo "⚠️  STUN server test inconclusive"
    fi
    
    # Test TURN server
    if timeout 10 docker exec webrtc-coturn turnutils_uclient -t -T -u webrtc -w webrtc123 -p 3478 localhost >/dev/null 2>&1; then
        echo "✅ TURN server authentication working"
    else
        echo "⚠️  TURN server test inconclusive"
    fi
else
    echo "❌ COTURN container not running"
fi
```

## 9. Summary of Required Changes

1. **Add COTURN service** to docker-compose.yml
2. **Create coturn/turnserver.conf** configuration file  
3. **Create coturn/logs/** directory
4. **Update ALL server files** (main.py, main_simple.py, etc.) with TURN support
5. **Update client/pages/index.js** with TURN configuration
6. **Add TURN environment variables** to ALL services in docker-compose.yml
7. **Add service dependencies** - all services depend on coturn
8. **Create testing scripts** (optional)

## 10. Deployment Commands

After making all changes:

```bash
# Create directories
mkdir -p coturn/logs

# Start with COTURN
docker-compose up --build

# Test COTURN
chmod +x test_coturn.sh
./test_coturn.sh

# Monitor COTURN logs
docker-compose logs -f coturn
```

This completes all the code changes needed to add COTURN support to your WebRTC application!