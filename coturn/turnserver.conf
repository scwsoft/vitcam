## 4. Next.js Client Code Changes

**File: `client/pages/index.js`** - Update RTCPeerConnection configuration:

```javascript
// Find this section and replace:
const rtcConfiguration = {
  iceServers: [
    // Public STUN servers (fallback)
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    // Local COTURN server (STUN and TURN)
    { 
      urls: `stun:${process.env.NEXT_PUBLIC_TURN_SERVER || 'localhost:3478'}` 
