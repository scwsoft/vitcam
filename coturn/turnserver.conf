# Complete COTURN Integration - All Code Changes Required

## 1. Docker Compose Changes

**File: `docker-compose.yml`**

Add COTURN service at the top and update all other services with TURN environment variables:

```yaml
version: '3.8'

services:
  # COTURN STUN/TURN Server - Add this service
  coturn:
    image: coturn/coturn:4.6.2
    container_name: webrtc-coturn
    network_mode: "host"
    environment:
      - DETECT_EXTERNAL_IP=yes
      - DETECT_RELAY_IP=yes
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
      - ./coturn/logs:/var/log/coturn
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "turnutils_peer -n -p 3478 -h localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: ["-c", "/etc/turnserver.conf", "-v"]

  # Update webrtc-server service
  webrtc-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: webrtc-server
    network_mode: "host"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      # Add TURN configuration
      - TURN_SERVER=localhost:3478
      - TURN_USERNAME=webrtc
      - TURN_PASSWORD=webrtc123
    depends_on:
      coturn:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Update webrtc-client service
  webrtc-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: webrtc-client
    network_mode: "host"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=localhost:8000
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Add TURN configuration
      - NEXT_PUBLIC_TURN_SERVER=localhost:3478
      - NEXT_PUBLIC_TURN_USERNAME=webrtc
      - NEXT_PUBLIC_TURN_PASSWORD=webrtc123
    depends_on:
      webrtc-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Apply same TURN environment variables to ALL other profiles (dev, bulletproof, simple, minimal)
  # ... (repeat for all other services)
```

## 2. COTURN Configuration File

**File: `coturn/turnserver.conf`** (CREATE NEW FILE)

```conf
# COTURN Server Configuration for WebRTC
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

verbose
log-file=/var/log/coturn/turnserver.log
stun-only=false
no-stun=false
realm=webrtc.local
external-ip-detect
relay-ip-detect

# Authentication
user=webrtc:webrtc123
lt-cred-mech

# Security settings
no-web-admin
no-cli
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Optimization
max-bps=3000000
fingerprint
mobility
no-tcp-relay
server-name="coturn-4.6.2"
prod
```

