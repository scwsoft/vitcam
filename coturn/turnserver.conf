    {
      urls: `turn:${process.env.NEXT_PUBLIC_TURN_SERVER || 'localhost:3478'}`,
      username: process.env.NEXT_PUBLIC_TURN_USERNAME || 'webrtc',
      credential: process.env.NEXT_PUBLIC_TURN_PASSWORD || 'webrtc123'
    }
  ],
