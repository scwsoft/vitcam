networks:
  vitcam-net:
    driver: bridge

services:

  vitcam-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vitcam-frontend
    ports:
      - "3000:3000"
      - "50000-50050:50000-50050/udp"
      - "19302:19302"
    networks:
      - vitcam-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-http://localhost:54321}
      - SUPABASE_KEY=${SUPABASE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-vitcam-recordings}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./certs:/app/certs
    restart: unless-stopped


  signaling-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8554:8554"
      - "8765:8765"
      - "3478:3478"
      - "16384:65535"
    networks:
      - vitcam-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-http://localhost:54321}
      - SUPABASE_KEY=${SUPABASE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-vitcam-recordings}
      - WEBRTC_HOST=host.docker.internal  # tell aiortc to use this as ICE candidate IP

    restart: unless-stopped


  # TURN/STUN Server (Coturn)
  turn-server:
    image: coturn/coturn:latest
    networks:
      - vitcam-net
    environment:
      - DETECT_RELAY_IP=yes
      - DETECT_EXTERNAL_IP=yes
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./coturn/logs:/var/log/coturn
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "turnutils_peer -n -p 3478 -h localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: ["-c", "/etc/turnserver.conf", "-v"]


  # Redis for session management (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - vitcam-net
    restart: unless-stopped